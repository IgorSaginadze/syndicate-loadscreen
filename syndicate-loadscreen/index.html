<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>СИНДИКАТ RP — загрузка</title>
<!--
  Экран загрузки сервера «СИНДИКАТ RP» (sv_loadingurl).
  Браузер игры - Chromium 86 без видеокарты: никакого WebGL, никакого inset,
  aspect-ratio и прочего новее 86-го. Проверка: python build/lscheck.py
  Показ без игры: index.html?demo (имитирует загрузку), ?s=5 - сразу слайд 5.
-->
<link rel="preload" href="fonts/stencil.woff2?v=30768940" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ptnarrow-b.woff2?v=0abf7b60" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/ls.css?v=9c4d6499">
<link rel="stylesheet" href="css/vig.css?v=84259579">
<link rel="stylesheet" href="css/vig_site.css?v=ec625f1d">
</head>
<body class="intro">

<canvas id="map"></canvas>
<div id="shade"></div>
<div id="grain"></div>
<div id="black"></div>

<div id="ui">
  <div id="pin" class="pin">
    <div class="pin-ring r1"></div><div class="pin-ring r2"></div>
    <div class="pin-cross"></div><div class="pin-dot"></div>
    <div class="pin-tag"><b id="pinName"></b><span id="pinSub"></span><i id="pinXY"></i></div>
  </div>

  <aside id="ident">
    <div id="emb">
      <canvas id="emblem"></canvas>
      <svg id="ring" viewBox="0 0 440 440" aria-hidden="true">
        <path id="ringTrack" d=""/>
        <path id="ringFill" d=""/>
        <g id="ringTicks"></g>
      </svg>
    </div>
    <div id="word"><span class="w-name">СИНДИКАТ</span><span class="w-rp">RP</span></div>
    <div id="wsub">СЕРВЕР РОЛЕВОЙ ИГРЫ · GARRY'S MOD</div>

    <div id="tip"><b>СОВЕТ</b><p id="tipText"></p></div>

    <section id="load">
      <div class="l-head"><span class="l-lbl">ЗАГРУЗКА</span><span id="pct">0<small>%</small></span></div>
      <div id="status">Соединяемся с сервером</div>
      <div id="file">&nbsp;</div>
      <div class="l-bar"><i id="bar"></i></div>
      <div class="l-meta"><span id="mMap">rp_syndicate</span><span id="mSlots"></span><span id="mFiles"></span></div>
    </section>
  </aside>

  <main id="stage">
    <header id="head">
      <div class="h-claim"><b>АВТОРСКИЕ СИСТЕМЫ</b><span>Их нет ни на одном другом сервере — и не будет.</span></div>
      <div class="h-right"><span id="count">01 <em>/ 15</em></span><span id="track">INYAKO — I'M REBORN</span><button id="snd" type="button" title="Музыка"><i></i><i></i><i></i><i></i></button></div>
    </header>

    <div id="slide"></div>

    <nav id="chap"></nav>
  </main>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script src="data/mapdata.js?v=51acc4c9"></script>

<script src="data/skillart.js?v=19c2fdca"></script>
<script src="js/vig_site.js?v=4327694f"></script>
<script src="data/phone_data.js?v=2d36e8f9"></script>
<script src="js/realphone.js?v=9e63b166"></script>
<script src="js/ls.js?v=57c816aa"></script>
</body>
</html>
